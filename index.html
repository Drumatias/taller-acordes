// Abre la última versión usada; si es la primera vez, elige según la pantalla.

  var v = null;
  try{ v = localStorage.getItem('taller-acordes:vista'); }catch(e){}
  if(!v){ v = (Math.min(screen.width, innerWidth) < 760 || matchMedia('(pointer:coarse)').matches) ? 'movil' : 'pc'; }
  location.replace(v === 'movil' ? 'movil.html' : 'pc.html');
})();
</script>
